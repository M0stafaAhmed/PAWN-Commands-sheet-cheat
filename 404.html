<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0618">
  <title>404 — PwnRef</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #0b0618; color: #f8fafc; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 20%, #251145 0, #0b0618 55%); }
    main { width: min(100%, 620px); padding: 48px; border: 1px solid rgba(168,85,247,.28); border-radius: 18px; background: rgba(19,10,38,.86); box-shadow: 0 24px 80px rgba(0,0,0,.35); }
    .eyebrow { color: #a78bfa; font: 600 12px/1.5 ui-monospace, monospace; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 16px 0 8px; font-size: clamp(56px, 12vw, 92px); line-height: .95; letter-spacing: -.07em; }
    h2 { margin: 20px 0 8px; font-size: 22px; }
    p { color: #aeb5c5; line-height: 1.7; }
    a { display: inline-flex; margin-top: 18px; padding: 12px 18px; border-radius: 9px; background: #8b5cf6; color: white; font-weight: 650; text-decoration: none; }
    a:focus-visible { outline: 3px solid #67e8f9; outline-offset: 3px; }
    @media (max-width: 520px) { main { padding: 30px 24px; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">PwnRef / Navigation error</div>
    <h1>404</h1>
    <h2>This path does not exist.</h2>
    <p>The page may have moved, or the address may be incorrect. Return to the command reference and continue from there.</p>
    <a href="/">Back to PwnRef</a>
  </main>
</body>
</html>
